name: Deploy WoW XP Helper
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the Polestar converter and game data
        run: python scripts/vendor_converter.py
      - name: Check bundled browser scripts
        run: |
          test -s _site/compile-worker.mjs
          test -s _site/converter/forge/polestar_convert_wasm_bg.wasm
          node --check _site/compile-worker.mjs
          node scripts/test-groups.mjs
          python scripts/test-ui.py _site/index.html
          python - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html').read_text(encoding='utf-8')
          start = '<script>"use strict";'
          assert start in html and '</script>' in html
          script = html.split(start,1)[1].split('</script>',1)[0]
          assert "new Worker(" in script and "cancelCompile" in script
          Path('_site/_inline_check.js').write_text('"use strict";' + script,encoding='utf-8')
          PY
          node --check _site/_inline_check.js
          rm _site/_inline_check.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for GitHub to index the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              | python -c "import json,sys; a=json.load(sys.stdin).get('artifacts',[]); sys.exit(0 if any(x.get('name')=='github-pages' for x in a) else 1)"; then
              echo "Pages artifact is visible to the GitHub API"
              sleep 5
              exit 0
            fi
            echo "Waiting for artifact to appear in GitHub API (attempt $attempt/8)"
            sleep 10
          done
          echo "Pages artifact was not indexed in time" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
